name: Codex Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codex-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base and head refs
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex code review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

          # 代码审查只需要读代码，不需要让 Codex 改文件
          sandbox: read-only

          # Linux/macOS 推荐，降低 runner 权限
          safety-strategy: drop-sudo

          # 把最终报告写入文件，方便上传或评论
          output-file: codex-review.md

          prompt: |
            你是一个严谨的高级代码审查工程师。

            请审查当前 Pull Request 的代码变更，并输出一份 Markdown 格式的代码审查报告。

            只审查本 PR 引入的变更，不要泛泛分析整个仓库。

            PR 信息：
            - 仓库：${{ github.repository }}
            - PR 编号：#${{ github.event.pull_request.number }}
            - PR 标题：${{ github.event.pull_request.title }}
            - Base SHA：${{ github.event.pull_request.base.sha }}
            - Head SHA：${{ github.event.pull_request.head.sha }}

            请重点检查：
            1. 潜在 bug
            2. 安全风险
            3. 边界条件
            4. 性能问题
            5. 可维护性问题
            6. 类型、空值、异常处理
            7. 是否有明显测试遗漏

            你可以使用以下命令了解变更范围：
            git diff --stat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            输出格式：

            # Codex 代码审查报告

            ## 总体结论
            用 3-5 句话总结本次 PR 的整体质量和风险等级。

            ## 高风险问题
            如无问题，写“未发现明显高风险问题”。

            ## 中低风险问题
            按文件列出问题、原因和建议。

            ## 测试建议
            给出建议补充的测试场景。

            ## 可合并性判断
            给出以下之一：
            - 可以合并
            - 建议修改后合并
            - 不建议合并

      - name: Upload Codex review report
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-report
          path: codex-review.md

      - name: Comment review report on PR
        if: steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');

            const reportPath = 'codex-review.md';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : process.env.CODEX_FINAL_MESSAGE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: report
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}